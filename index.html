<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HQL_2311 - Toggle UI Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .panel {
      width: min(420px, 92vw);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: .5px;
    }
    .sub {
      margin: 0 0 20px;
      color: #94a3b8;
      font-size: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid #334155;
    }
    .row:first-of-type { border-top: 0; }
    .label { font-size: 15px; }
    .status {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      width: 54px;
      height: 30px;
      flex: 0 0 auto;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #475569;
      border-radius: 999px;
      transition: .2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 4px;
      top: 4px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }
    .switch input:checked + .slider {
      background: #22c55e;
    }
    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }
    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>HQL_2311</h1>
    <p class="sub">Giao diện công tắc bật/tắt mẫu</p>

    <div class="row">
      <div>
        <div class="label">Tính năng A</div>
        <span class="status" id="statusA">Đang tắt</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleA" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="label">Tính năng B</div>
        <span class="status" id="statusB">Đang tắt</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleB" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="label">Tính năng C</div>
        <span class="status" id="statusC">Đang tắt</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleC" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="footer">Demo UI — không có chức năng gian lận</div>
  </main>

  <script>
    const items = [
      { id: 'A', name: 'Tính năng A' },
      { id: 'B', name: 'Tính năng B' },
      { id: 'C', name: 'Tính năng C' }
    ];

    items.forEach(({ id, name }) => {
      const input = document.getElementById(`toggle${id}`);
      const status = document.getElementById(`status${id}`);

      // Khôi phục trạng thái đã lưu
      const saved = localStorage.getItem(`HQL_2311_${id}`);
      if (saved === 'on') {
        input.checked = true;
        status.textContent = 'Đang bật';
      }

      input.addEventListener('change', () => {
        const on = input.checked;
        status.textContent = on ? 'Đang bật' : 'Đang tắt';
        localStorage.setItem(`HQL_2311_${id}`, on ? 'on' : 'off');
      });
    });
  </script>
</body>
</html>
